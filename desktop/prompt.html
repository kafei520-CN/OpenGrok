<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>OpenGrok</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #161b22;
        --elev: #1c232c;
        --fg: #e8eef6;
        --muted: #8b97a8;
        --line: rgb(255 255 255 / 12%);
        --ice: #59a0f2;
      }
      html,
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font: 13px/1.45 "Segoe UI Variable", "Segoe UI", "Microsoft YaHei", sans-serif;
      }
      main {
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        min-height: 100vh;
        box-sizing: border-box;
      }
      h1 {
        margin: 0;
        font-size: 14px;
        font-weight: 650;
      }
      p {
        margin: 0;
        color: var(--muted);
        font-size: 12px;
      }
      input,
      select {
        width: 100%;
        box-sizing: border-box;
        border: 1px solid var(--line);
        background: color-mix(in srgb, var(--bg) 72%, transparent);
        color: var(--fg);
        border-radius: 9px;
        padding: 8px 10px;
        font: inherit;
      }
      input:focus,
      select:focus {
        outline: none;
        border-color: color-mix(in srgb, var(--ice) 50%, var(--line));
      }
      .items {
        display: flex;
        flex-direction: column;
        gap: 4px;
        max-height: 220px;
        overflow: auto;
      }
      .items button {
        text-align: left;
        border: 1px solid transparent;
        background: rgb(255 255 255 / 4%);
        color: inherit;
        border-radius: 8px;
        padding: 8px 10px;
        font: inherit;
        cursor: pointer;
      }
      .items button:hover,
      .items button:focus-visible {
        border-color: color-mix(in srgb, var(--ice) 45%, transparent);
        background: color-mix(in srgb, var(--ice) 12%, transparent);
      }
      .items em {
        display: block;
        color: var(--muted);
        font-style: normal;
        font-size: 12px;
      }
      .row {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: auto;
      }
      .row button {
        border: 1px solid var(--line);
        border-radius: 9px;
        padding: 6px 12px;
        font: inherit;
        cursor: pointer;
      }
      .ghost {
        background: var(--elev);
        color: var(--fg);
      }
      .ok {
        background: var(--fg);
        color: var(--bg);
        border-color: transparent;
        font-weight: 620;
      }
    </style>
  </head>
  <body>
    <main>
      <h1 id="title">OpenGrok</h1>
      <p id="copy" hidden></p>
      <input id="field" hidden />
      <div id="items" class="items" hidden></div>
      <div class="row">
        <button class="ghost" id="cancel" type="button">取消</button>
        <button class="ok" id="ok" type="button">确定</button>
      </div>
    </main>
    <script src="./prompt.js"></script>
  </body>
</html>
