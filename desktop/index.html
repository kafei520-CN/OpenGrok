<!doctype html>
<html class="opengrok" lang="zh-CN" data-version="0.5.6">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data: blob: file: https:; media-src 'self' blob: file:; font-src 'self' data: file:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self' https: http://127.0.0.1:* http://localhost:*;"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>OpenGrok</title>
    <link rel="stylesheet" href="../plugin/media/chat.css" />
    <link rel="stylesheet" href="../plugin/media/katex/katex.min.css" />
    <link rel="stylesheet" href="../plugin/media/diff.css" />
    <link rel="stylesheet" href="../plugin/media/surfaces.css" />
    <link rel="stylesheet" href="../plugin/media/border-glow.css" />
    <link rel="stylesheet" href="../plugin/media/option-wheel.css" />
    <link rel="stylesheet" href="./xterm.css" />
    <link rel="stylesheet" href="./workbench.css" />
  </head>
  <body>
    <div id="app">
      <div class="og-splash" role="status" aria-label="Starting OpenGrok">
        <svg class="boot-logo" viewBox="0 0 35 33" width="72" height="68" fill="none" aria-hidden="true">
          <path class="boot-a" pathLength="1" d="M10.9503 23.0313C7.07343 19.3235 7.74185 13.5853 11.0498 10.2763C13.4959 7.82722 17.5036 6.82767 21.0021 8.2971L24.7595 6.55998C24.0826 6.07017 23.215 5.54334 22.2195 5.17313C17.7198 3.31926 12.3326 4.24192 8.67479 7.90126C5.15635 11.4239 4.0499 16.8403 5.94992 21.4622C7.36924 24.9165 5.04257 27.3598 2.69884 29.826C1.86829 30.7002 1.0349 31.5745 0.36364 32.5L10.9474 23.0341"/>
          <path class="boot-b" pathLength="1" d="M13.2371 21.0407L24.3186 12.8506C24.8619 12.4491 25.6384 12.6057 25.8973 13.2294C27.2597 16.5185 26.651 20.4712 23.9403 23.1851C21.2297 25.8989 17.4581 26.4941 14.0108 25.1386L10.2449 26.8843C15.6463 30.5806 22.2053 29.6665 26.304 25.5601C29.5551 22.3051 30.562 17.8683 29.6205 13.8673L29.629 13.8758C28.2637 7.99809 29.9647 5.64871 33.449 0.844576C33.5314 0.730667 33.6139 0.616757 33.6964 0.5L29.1113 5.09055V5.07631L13.2343 21.0436"/>
        </svg>
      </div>
    </div>
    <script>
      window.acquireVsCodeApi = function () {
        if (window.__grokVscode) {
          return window.__grokVscode;
        }
        var state = undefined;
        try {
          state = JSON.parse(localStorage.getItem('grok-ui') || 'null');
        } catch (error) {}
        window.__grokVscode = {
          postMessage: function (msg) {
            window.opengrok.post(msg);
          },
          getState: function () {
            return state;
          },
          setState: function (next) {
            state = next;
            try {
              localStorage.setItem('grok-ui', JSON.stringify(next));
            } catch (error) {}
          },
        };
        return window.__grokVscode;
      };
      window.opengrok.onHost(function (data) {
        window.dispatchEvent(new MessageEvent('message', { data: data }));
      });
      (function () {
        var og = window.opengrok;
        if (!og) {
          return;
        }
        function setMax(on) {
          document.documentElement.classList.toggle('maximized', Boolean(on));
        }
        if (og.onMaximized) {
          og.onMaximized(setMax);
        }
        if (og.maximized) {
          og.maximized().then(setMax);
        }
      })();
    </script>
    <script>
      window.addEventListener('error', function (event) {
        window.__bootErr = String(event.message || event.error || 'error');
      });
    </script>
    <script src="../plugin/dist/webview.js"></script>
  </body>
</html>
